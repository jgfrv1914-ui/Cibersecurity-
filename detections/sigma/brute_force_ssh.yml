title: SSH Brute Force Authentication Failures
id: 6b94b4ed-25c4-4f58-9f1b-portfolio001
status: experimental
description: Detects repeated failed SSH authentication attempts in Linux logs.
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains: "Failed password"
  condition: selection
level: high
tags:
  - attack.credential_access
  - attack.t1110
